<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Tables</title>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const TimesTables = () => {
            const createRandomNum = () => Math.ceil(Math.random() * 9)
            const [num1, setNum1] = React.useState(createRandomNum)
            const [num2, setNum2] = React.useState(createRandomNum)
            const [value, setValue] = React.useState('')
            const [result, setResult] = React.useState('')

            const inputRef = React.useRef()

            const onChange = (e) => setValue(e.target.value)

            const onSubmit = (e) => {
                e.preventDefault()
                if (parseInt(value) === parseInt(num1) * parseInt(num2)) {
                    setNum1(createRandomNum)
                    setNum2(createRandomNum)
                    setResult(value + ' is Correct 🎉')
                    setValue('')
                    inputRef.current.focus()
                } else {
                    setResult('Wrong ❌')
                    setValue('')
                    inputRef.current.focus()
                }
            }

            return (
                <>
                    <div>Multiply {num1} by {num2}</div>
                    <form onSubmit={onSubmit}>
                        <input ref={inputRef} type="number" value={value} onChange={onChange} />
                        <button>Submit</button>
                    </form>
                    <div>{result}</div>
                </>
            )
        }


    </script>
    <script type="text/babel">
        ReactDOM.createRoot(document.querySelector('#root')).render(<TimesTables />)
    </script>
</body>
</html>
